name: p0-skeleton-sllm-h2
envelope: E0
track: A
hypotheses:
- P0-unit-costs
system: sllm
dataset: lbmhqa
cell: late-h2-32k-a0
split: dev
seed: 0
entrypoint: opa.tracks.track_a:build_skeletons
args:
  items_uri:
  - uri: gs://{bucket}/opa/data/lbmhqa/dev/v2/late-h2-32k-a0/items.jsonl.gz
    n_items: 50
  workers: 12
  model:
    kind: open_local
    name: qwen
    max_model_len: 40960
models:
  agent_model: Qwen/Qwen3-4B-Instruct-2507
compute:
  kind: gpu
  gpu: L4
  image: vllm
  cpu: 2.0
  memory_gib: 16
estimate_formula: '240 s start-up + 50 items (late-h2-32k-a0 x 50) x 28.4 s (8 calls: 37.6K prefill tok / 4000 tok/s + 3.8K entity-list out tok / 200 tok/s at 12 streams) x 1.25 = 2015 s x (L4 0.000222 + 4 cores(limit) x 0.0000131 + 32 GiB(limit) x 0.00000222 = 0.000345 $/s) = $0.696'
estimate_usd: 0.7
max_usd: 1.4
max_api_usd: 0
notes:
- the skeleton directory is <this run's gs:// prefix>/skeleton_llm; the run id of this job replaces the h2 skeleton placeholder in the later specs of the systems that need an S-llm skeleton (S8-S12, S14-S18, S12F)
