estimate_formula: '180 s vLLM start (measured) + 10 items x 14.0 s (S1: 14.0 s assumed at 1 worker, prefix caching off) = 320 s x (L4 0.000222 + 4 cores(limit) x 0.0000131 + 32 GiB(limit) x 0.00000222 = 0.000345 $/s) = $0.111'
estimate_usd: 0.12
max_usd: 0.23
max_api_usd: 0
notes:
- 'determinism probe: separate container, seed 0, same 10 items as the G0 attempt-1 S1 repeats (first 10 of the 50)'
- 'no batching and no prefix caching: tests whether concurrency causes the run-to-run spread'
- fill the embedding run-id placeholder from p0-embed-dev (S1 itself does not use the vectors)
