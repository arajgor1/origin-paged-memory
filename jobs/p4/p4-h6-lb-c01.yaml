track: B
hypotheses: [H6]
system: R0-R7
dataset: lbmhqa
cell: late-h2-16k-a0
split: test
seed: 100000
entrypoint: opa.trackb.remedies:main
args:
  model: Qwen/Qwen3-4B-Instruct-2507
  hf_dir: /cache/hf/pg19
  split: test
  seed0: 100000
  prereg_tag: {"tag": "prereg-v2", "commit": "c8a0a5e910abf2da315bd00425f5c90d9e82600c"}
