# Rate from the human-owned rate card (verified 2026-11-06), USD per second, CPU and memory at their limits:
#   L4 0.000222 + 4.0 cores(limit) x 0.0000131 + 32 GiB(limit) x 0.00000222 = 0.00034544 /s (= $1.24/h)
estimate_formula: "300 s overhead + 100 items x 19.5 s (remedies pilot, 8K; a window is 6 origins whatever the item length) x 1.1 margin = 2445 s x 0.00034544 $/s = $0.84"
estimate_usd: 0.84
max_usd: 1.68                                # first-time job type: 2x the estimate; launcher timeout = floor(1.68 / 0.00034544) = 4,863 s
max_api_usd: 0
